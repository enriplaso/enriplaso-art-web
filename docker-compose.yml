services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: art_shop
      POSTGRES_PASSWORD: art_shop
      POSTGRES_DB: art_shop
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U art_shop -d art_shop']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
